[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudgap"
version = "1.0.0"
description = "Contiguous vs scattered occlusion for geospatial foundation models (CV4EO @ WACV 2027)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Srija Yadav Vuppula", email = "srijayadav@uga.edu"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
